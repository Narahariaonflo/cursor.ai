services:
  postgres:
    image: postgres:16-alpine
    container_name: orca-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orca}
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orca_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: orca-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orca_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orca_minio_dev_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - orca_minio_data:/data
  minio-init:
    image: minio/mc:latest
    container_name: orca-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb --ignore-existing local/$${S3_BUCKET:-orca-artifacts};
      mc anonymous set none local/$${S3_BUCKET:-orca-artifacts};
      echo 'minio bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orca_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orca_minio_dev_only}
      S3_BUCKET: ${S3_BUCKET:-orca-artifacts}
    restart: "no"

volumes:
  orca_postgres_data:
  orca_minio_data:
