[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-website-health-orchestrator"
version = "0.1.0"
description = "Read-only website analysis MVP"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]
browser = [
    "playwright",
]
production = [
    "psycopg[binary]",
    "boto3",
]
docker = [
    "psycopg[binary]",
    "boto3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: isolated domain or application tests",
    "property: generated invariant tests",
    "architecture: dependency-boundary tests",
    "contract: reusable port conformance tests",
    "integration: adapter or service integration tests",
    "browser: browser-runtime tests",
    "e2e: full workflow tests",
    "security: adversarial security tests",
    "resilience: fault and recovery tests",
    "performance: capacity and latency tests",
    "slow: intentionally long-running tests",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/adapters/outbound/browser/playwright_browser.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
